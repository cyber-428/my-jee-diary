<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JEE Elite Private Diary</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithRedirect, getRedirectResult, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // VERIFIED CONFIGURATION
        const firebaseConfig = {
            apiKey: "AIzaSyCiJ7s3HQLzhZii4vJapN4E_3C92K7mX20", // Fully verified key
            authDomain: "myjeetracker-36bac.firebaseapp.com",
            projectId: "myjeetracker-36bac",
            storageBucket: "myjeetracker-36bac.appspot.com",
            messagingSenderId: "779784201034",
            appId: "1:779784201034:web:51236a92842490b4d4586a",
            measurementId: "G-YMCWJ1GKPY"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth();
        const db = getFirestore();
        const provider = new GoogleAuthProvider();

        window.login = () => {
            signInWithRedirect(auth, provider).catch((error) => {
                alert("Trigger Error: " + error.message);
            });
        };

        getRedirectResult(auth).catch((error) => {
            if(error.code !== "auth/redirect-cancelled-by-user") {
                alert("Google Return Error: " + error.message);
            }
        });

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('loginPage').classList.add('hidden');
                document.getElementById('mainApp').classList.remove('hidden');
                document.getElementById('userGreeting').innerText = "Protocol Active: " + user.displayName.split(' ')[0];
                document.getElementById('logDate').valueAsDate = new Date();
                calculateMatrix(); 
            }
        });

        window.calculateMatrix = () => {
            const getVal = (id) => parseInt(document.getElementById(id).value) || 0;
            const pPts = getVal('p_b')*5 + getVal('p_m')*10 + getVal('p_i')*15 + getVal('p_a')*30 + getVal('p_o')*50;
            const cPts = getVal('c_b')*5 + getVal('c_m')*10 + getVal('c_i')*15 + getVal('c_a')*30 + getVal('c_o')*50;
            const mPts = getVal('m_b')*5 + getVal('m_m')*10 + getVal('m_i')*15 + getVal('m_a')*30 + getVal('m_o')*50;
            const basePoints = pPts + cPts + mPts;

            const ftcBonus = getVal('ftc') * 3;
            const sillyMains = getVal('silly_m') * 2;
            const sillyAdv = getVal('silly_a') * 5;
            const distPenalty = Math.floor(getVal('dist_tally') / 5) * 10;

            const maxSub = Math.max(pPts, cPts, mPts);
            const minSub = Math.min(pPts, cPts, mPts);
            let subPenalty = (maxSub - minSub > 40 && basePoints > 30) ? 20 : 0;

            const gross = basePoints + ftcBonus - sillyMains - sillyAdv;
            const net = gross - distPenalty - subPenalty;
            const hours = parseFloat(document.getElementById('studyHours').value) || 0;
            let density = hours > 0 ? (net / hours).toFixed(1) : 0;
            if (density > 20 && hours > 0) density = "20.0 (Max)";

            document.getElementById('grossDisplay').innerText = gross;
            document.getElementById('netDisplay').innerText = net;
            document.getElementById('imbalanceDisplay').innerText = subPenalty > 0 ? "-20" : "0";
            document.getElementById('densityDisplay').innerText = density;
        };

        window.setupListeners = () => {
            document.querySelectorAll('input[type="number"]').forEach(input => {
                input.addEventListener('input', calculateMatrix);
            });
        };

        window.saveEntry = async () => {
            const user = auth.currentUser;
            const date = document.getElementById('logDate').value;
            if(!date) return alert("Select a date!");

            const data = {
                grossPoints: document.getElementById('grossDisplay').innerText,
                netPoints: document.getElementById('netDisplay').innerText,
                density: document.getElementById('densityDisplay').innerText,
                studyHours: document.getElementById('studyHours').value,
                timestamp: new Date()
            };

            try {
                await setDoc(doc(db, "users", user.uid, "entries", date), data);
                alert("Day " + date + " Protocol Synced Successfully!");
            } catch (e) {
                alert("Cloud Sync Fail: Check Firestore Rules.");
            }
        };

        setTimeout(window.setupListeners, 500);
    </script>
    <style>
        body { background: #0f172a; color: #f8fafc; font-family: sans-serif; }
        .glass { background: rgba(30, 41, 59, 0.7); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 16px; margin-bottom: 16px; }
        input[type="number"] { background: #1e293b; border: 1px solid #334155; color: white; border-radius: 8px; padding: 8px; width: 100%; text-align: center; }
        input[type="date"] { background: #1e293b; color: white; border: none; outline: none;}
        .section-title { font-size: 0.75rem; font-weight: bold; color: #38bdf8; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 12px; }
    </style>
</head>
<body class="p-4 pb-20">
    <div id="loginPage" class="h-screen flex flex-col items-center justify-center text-center">
        <h1 class="text-4xl font-bold mb-2 bg-gradient-to-r from-blue-400 to-emerald-400 bg-clip-text text-transparent">JEE ELITE</h1>
        <p class="text-gray-400 mb-8 tracking-widest text-sm uppercase">Preparation Protocol</p>
        <button onclick="login()" class="bg-white text-black px-8 py-3 rounded-full font-bold shadow-xl active:scale-95 transition">Login with Google</button>
    </div>

    <div id="mainApp" class="hidden max-w-md mx-auto space-y-4">
        <header class="flex justify-between items-center mb-6">
            <h2 id="userGreeting" class="text-sm font-bold text-emerald-400">Protocol Active</h2>
            <input type="date" id="logDate" class="text-sm rounded-md p-1">
        </header>

        <div class="glass">
            <h3 class="section-title">Sec I: Question Breakdown</h3>
            <div class="grid grid-cols-4 gap-2 text-[10px] text-center text-gray-400 mb-2">
                <div>TIER / PTS</div><div>PHY</div><div>CHEM</div><div>MATH</div>
            </div>
            <div class="grid grid-cols-4 gap-2 mb-2 items-center">
                <div class="text-[10px] text-right pr-2">Basic (5)</div>
                <input id="p_b" type="number" placeholder="0"><input id="c_b" type="number" placeholder="0"><input id="m_b" type="number" placeholder="0">
            </div>
            <div class="grid grid-cols-4 gap-2 mb-2 items-center">
                <div class="text-[10px] text-right pr-2">Mains (10)</div>
                <input id="p_m" type="number" placeholder="0"><input id="c_m" type="number" placeholder="0"><input id="m_m" type="number" placeholder="0">
            </div>
            <div class="grid grid-cols-4 gap-2 mb-2 items-center">
                <div class="text-[10px] text-right pr-2 text-emerald-400 font-bold">Inter (15)</div>
                <input id="p_i" type="number" placeholder="0"><input id="c_i" type="number" placeholder="0"><input id="m_i" type="number" placeholder="0">
            </div>
            <div class="grid grid-cols-4 gap-2 mb-2 items-center">
                <div class="text-[10px] text-right pr-2 text-blue-400 font-bold">Adv (30)</div>
                <input id="p_a" type="number" placeholder="0"><input id="c_a" type="number" placeholder="0"><input id="m_a" type="number" placeholder="0">
            </div>
            <div class="grid grid-cols-4 gap-2 mb-2 items-center">
                <div class="text-[10px] text-right pr-2 text-purple-400 font-bold">Olympiad (50)</div>
                <input id="p_o" type="number" placeholder="0"><input id="c_o" type="number" placeholder="0"><input id="m_o" type="number" placeholder="0">
            </div>
        </div>

        <div class="glass grid grid-cols-2 gap-4">
            <div>
                <h3 class="section-title text-red-400">Distractions</h3>
                <input id="dist_tally" type="number" placeholder="0">
                <h3 class="section-title mt-4 text-yellow-400">Time Log</h3>
                <input id="studyHours" type="number" step="0.1" placeholder="0">
            </div>
            <div>
                <h3 class="section-title text-emerald-400">Accuracy Box</h3>
                <input id="ftc" type="number" placeholder="0" class="mb-2">
                <input id="silly_m" type="number" placeholder="0" class="mb-2">
                <input id="silly_a" type="number" placeholder="0">
            </div>
        </div>

        <div class="glass bg-slate-800 border-blue-500">
            <div class="grid grid-cols-2 gap-4 text-center">
                <div class="p-2 bg-slate-900 rounded-lg">
                    <p class="text-[10px] text-gray-400 uppercase">Gross Points</p>
                    <p id="grossDisplay" class="text-xl font-bold">0</p>
                </div>
                <div class="p-2 bg-slate-900 rounded-lg border border-red-500/30">
                    <p class="text-[10px] text-red-400">Imbalance Pen.</p>
                    <p id="imbalanceDisplay" class="text-xl font-bold text-red-400">0</p>
                </div>
                <div class="p-2 bg-slate-900 rounded-lg border border-emerald-500/50">
                    <p class="text-[10px] text-emerald-400 uppercase">Net Points</p>
                    <p id="netDisplay" class="text-2xl font-bold text-emerald-400">0</p>
                </div>
                <div class="p-2 bg-blue-900/50 rounded-lg border border-blue-400">
                    <p class="text-[10px] text-blue-300 uppercase">Density</p>
                    <p id="densityDisplay" class="text-2xl font-bold text-blue-300">0.0</p>
                </div>
            </div>
        </div>

        <button onclick="saveEntry()" class="w-full bg-blue-600 py-4 rounded-xl font-bold">SYNC TO CLOUD</button>
    </div>
</body>
    </html>
